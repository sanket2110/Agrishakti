spring.application.name=agrishakti
server.port=8080

# H2 File-Based Database Configuration (Persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/agrishaktidb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Python AI Service URL
ai.service.url=http://localhost:8000/predict

# Weather API Key (OpenWeatherMap)
weather.api.key=YOUR_OPENWEATHER_API_KEY
weather.api.url=http://api.openweathermap.org/data/2.5/weather
