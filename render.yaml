services:
  # 1. Spring Boot Backend
  - type: web
    name: agrishakti-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: AI_SERVICE_URL
        value: http://agrishakti-ai:8000/predict

  # 2. Python AI Module
  - type: web
    name: agrishakti-ai
    runtime: docker
    rootDir: ai-module
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # 3. React Frontend (Static Site)
  - type: web
    name: agrishakti-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agrishakti-backend.onrender.com
